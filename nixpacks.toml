[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "gcc"]

[phases.install]
cmds = [
    "pip install -r backend/requirements.txt --break-system-packages"
]

[phases.build]
cmds = []

[start]
cmd = "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 300"
